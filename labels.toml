# The labels the Renovate presets and repository configs put on pull requests.
# .github/workflows/labels.yml creates or updates them in every repository that
# has a renovate.json; `repos` limits a label to the repositories named.
# Removing a label here does not delete it anywhere.

[[label]]
name = "dependencies"
color = "0366d6"
description = "A dependency update opened by Renovate"

[[label]]
name = "ppa"
color = "d93f0b"
description = "After merging: rebuild and upload the PPA's source packages"
repos = ["machine-setup"]

[[label]]
name = "containers"
color = "fbca04"
description = "After merging: apply the playbook on the server"
repos = ["homeserver-setup"]
